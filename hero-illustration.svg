  <!-- buku terbuka di atas -->
  <g transform="translate(150,90)">
    <path d="M0 60 C 40 35, 90 35, 130 60 L 130 15 C 90 -8, 40 -8, 0 15 Z" fill="#fdfbf7" stroke="#c9a24b" stroke-width="2"/>
    <path d="M130 60 C 170 35, 220 35, 260 60 L 260 15 C 220 -8, 170 -8, 130 15 Z" fill="#fdfbf7" stroke="#c9a24b" stroke-width="2"/>
    <path d="M8 22 C 40 8, 85 8, 122 22" stroke="#d9cdb0" stroke-width="2" fill="none"/>
    <path d="M8 34 C 40 20, 85 20, 122 34" stroke="#d9cdb0" stroke-width="2" fill="none"/>
    <path d="M8 46 C 40 32, 85 32, 122 46" stroke="#d9cdb0" stroke-width="2" fill="none"/>
    <path d="M138 22 C 175 8, 220 8, 252 22" stroke="#d9cdb0" stroke-width="2" fill="none"/>
    <path d="M138 34 C 175 20, 220 20, 252 34" stroke="#d9cdb0" stroke-width="2" fill="none"/>
    <path d="M138 46 C 175 32, 220 32, 252 46" stroke="#d9cdb0" stroke-width="2" fill="none"/>
  </g>

  <!-- bintang dekorasi -->
  <g fill="#c9a24b" opacity="0.85">
    <path d="M70 60 l4 10 11 1 -8 7 3 11 -10 -6 -10 6 3 -11 -8 -7 11 -1 z"/>
    <path d="M420 140 l3 7 8 1 -6 5 2 8 -7 -4 -7 4 2 -8 -6 -5 8 -1 z"/>

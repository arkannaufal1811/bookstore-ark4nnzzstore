      <stop offset="0" stop-color="#f0e6d2"/>
      <stop offset="1" stop-color="#e2c496"/>
    </linearGradient>
  </defs>

  <!-- shadow dasar -->
  <ellipse cx="245" cy="392" rx="150" ry="16" fill="#2a1533" opacity="0.12"/>

  <!-- tumpukan buku -->
  <g>
    <!-- buku 1 (paling bawah) -->
    <rect x="95" y="330" width="300" height="46" rx="4" fill="#a91cc0"/>
    <rect x="95" y="330" width="300" height="10" fill="#c724d6"/>
    <rect x="380" y="330" width="15" height="46" fill="#7a1591"/>

    <!-- buku 2 -->
    <rect x="115" y="288" width="270" height="44" rx="4" fill="#e8cf94"/>
    <rect x="115" y="288" width="270" height="9" fill="#c9a24b"/>
    <rect x="370" y="288" width="15" height="44" fill="#b8873a"/>

    <!-- buku 3 -->
    <rect x="105" y="248" width="285" height="42" rx="4" fill="#3ec6c6"/>
    <rect x="105" y="248" width="285" height="9" fill="#2fa8a8"/>
    <rect x="375" y="248" width="15" height="42" fill="#1f8a8a"/>

    <!-- buku 4 -->
    <rect x="125" y="208" width="260" height="42" rx="4" fill="#f28b82"/>
    <rect x="125" y="208" width="260" height="9" fill="#e05c52"/>
    <rect x="365" y="208" width="15" height="42" fill="#c23f36"/>

    <!-- buku 5 (miring dikit biar natural) -->
    <g transform="rotate(-3 250 190)">
      <rect x="130" y="168" width="250" height="40" rx="4" fill="#7c5cbf"/>
      <rect x="130" y="168" width="250" height="9" fill="#5f3fa3"/>
      <rect x="360" y="168" width="15" height="40" fill="#4a3186"/>
    </g>
